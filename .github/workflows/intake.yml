name: Intake
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
  actions: write
concurrency:
  group: intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check the files and merge into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "media-intake"
          git config user.email "media-intake@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          added=$(git diff --name-only --diff-filter=AM "main...origin/$BRANCH")
          other=$(git diff --name-only --diff-filter=DRTCUXB "main...origin/$BRANCH")
          bad=$(printf '%s\n' "$added" | grep -vE '^[a-z0-9-]+/[0-9]{4}/[0-9]{2}/[0-9]{2}/[A-Za-z0-9._-]+\.(png|jpg|jpeg|webp|gif|mp4)$' | grep -v '^$' || true)
          if [ -n "$bad" ] || [ -n "$other" ]; then
            echo "Refused. Only new media files under <brand>/<yyyy>/<mm>/<dd>/ are accepted."
            printf '%s\n' "$bad" "$other"
            exit 1
          fi
          if [ -z "$added" ]; then echo "Nothing new."; exit 0; fi
          git merge --no-ff --no-edit "origin/$BRANCH" -m "Media from $BRANCH"
          git push origin main
          git push origin --delete "$BRANCH"
      - name: Start Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main --repo "$GITHUB_REPOSITORY"
